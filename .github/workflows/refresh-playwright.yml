name: Refresh Playwright CI pins

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create escalation token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: escalation-token
        with:
          client-id: ${{ vars.ESCALATION_APP_ID }}
          private-key: ${{ secrets.ESCALATION_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Capture default branch HEAD SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Refresh Playwright package and image pins
        run: make refresh-ci-pins

      - name: Detect workflow changes
        id: changes
        run: |
          git add pyproject.toml uv.lock .github/workflows/update.yml .github/workflows/live-site-smoke.yml
          if git diff --staged --quiet -- pyproject.toml uv.lock .github/workflows/update.yml .github/workflows/live-site-smoke.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes (verified)
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/verified-commit
        with:
          github-token: ${{ steps.escalation-token.outputs.token }}
          base-branch: ${{ github.event.repository.default_branch }}
          expected-head-sha: ${{ steps.head.outputs.sha }}
          commit-headline: "Refresh Playwright CI pins"
          fallback-branch-prefix: ci/refresh-playwright
          pr-title: "Refresh Playwright CI pins"
          pr-body: |
            ## Summary
            - Type: CI maintenance
            - Keep the locked Python Playwright package aligned with the official CI image
            - Refresh the image digest for reproducible browser environments
          pathspec: |
            pyproject.toml
            uv.lock
            .github/workflows/update.yml
            .github/workflows/live-site-smoke.yml
          commit-mode: force-pr
