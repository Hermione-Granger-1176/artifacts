name: Live Site Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

env:
  PYTHONPATH: "."
  REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ARTIFACTS_FAIL_ON_FLAKY_BROWSER_TESTS: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      # The official image does not include GNU make. Use its default root user
      # only to install GNU make before the Makefile-only setup runs.
      options: --init --ipc=host
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install GNU make
        run: |
          if ! command -v make >/dev/null 2>&1; then
            apt-get update
            apt-get install --no-install-recommends --yes make
            rm -rf /var/lib/apt/lists/*
          fi

      - name: CI setup
        id: setup
        uses: ./.github/actions/ci-setup
        with:
          event-name: ${{ github.event_name }}
          python-version: "3.12"
          node-version: "24"
          install-deps: "true"
          browser-engines: ""

      - name: Resolve live site URL
        id: site-url
        run: |
          site_url=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['artifacts']['site_url'])")
          echo "url=${site_url}" >> "$GITHUB_OUTPUT"

      - name: Run published-site browser verification
        id: smoke
        env:
          ARTIFACTS_LIVE_SITE_URL: ${{ steps.site-url.outputs.url }}
          ARTIFACTS_BROWSER_ARTIFACT_DIR: .artifacts/browser-live/scheduled-smoke
        run: |
          set +e
          make test-browser-live
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload live-site smoke failure artifacts
        if: steps.smoke.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-site-smoke-artifacts-${{ github.run_id }}
          path: .artifacts/browser-live
          if-no-files-found: ignore
          overwrite: true

      - name: Open or update live-site smoke issue
        if: steps.smoke.outputs.status != '0'
        id: live-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_DETAIL: "Published URL: ${{ steps.site-url.outputs.url }}"
        run: |
          url=$(printf '%s\n' "$ALERT_DETAIL" | TITLE="Live site smoke check failed" make ci-alert-issue state=open run_url="$RUN_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close live-site smoke issue when clean
        if: steps.smoke.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="Live site smoke check failed" make ci-alert-issue state=close run_url="$RUN_URL"

      - name: Summarize live-site smoke failure
        if: steps.smoke.outputs.status != '0'
        run: |
          {
            echo "## Live site smoke failed"
            echo
            echo "Published URL: ${{ steps.site-url.outputs.url }}"
            echo "Issue: ${{ steps.live-issue.outputs.url || 'issue not created' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert when live-site smoke setup fails
        if: failure() && steps.smoke.outputs.status == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="Live site smoke check failed" make ci-alert-issue state=setup-failure run_url="$RUN_URL"

      - name: Fail workflow on smoke regression
        if: steps.smoke.outputs.status != '0'
        run: exit 1
