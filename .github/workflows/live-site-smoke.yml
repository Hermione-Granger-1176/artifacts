name: Live Site Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

env:
  PYTHONPATH: "."
  REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ARTIFACTS_FAIL_ON_FLAKY_BROWSER_TESTS: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
      # The image has neither GNU make nor GitHub CLI. The apt-install step
      # below adds them.
      options: --init --ipc=host
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ steps.smoke.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install workflow tools
        uses: ./.github/actions/apt-install
        with:
          packages: gh make

      - name: CI setup
        id: setup
        uses: ./.github/actions/ci-setup
        with:
          event-name: ${{ github.event_name }}
          python-version: "3.12"
          node-version: "24"
          install-deps: "true"
          browser-engines: ""

      - name: Resolve live site URL
        id: site-url
        run: |
          site_url=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['artifacts']['site_url'])")
          echo "url=${site_url}" >> "$GITHUB_OUTPUT"

      - name: Run published-site browser verification
        id: smoke
        env:
          ARTIFACTS_LIVE_SITE_URL: ${{ steps.site-url.outputs.url }}
          ARTIFACTS_BROWSER_ARTIFACT_DIR: .artifacts/browser-live/scheduled-smoke
        run: |
          set +e
          make test-browser-live
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload live-site smoke failure artifacts
        if: steps.smoke.outputs.status != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-site-smoke-artifacts-${{ github.run_id }}
          path: .artifacts/browser-live
          if-no-files-found: ignore
          overwrite: true

      - name: Open or update live-site smoke issue
        if: steps.smoke.outputs.status != '0'
        id: live-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_DETAIL: "Published URL: ${{ steps.site-url.outputs.url }}"
        run: |
          url=$(printf '%s\n' "$ALERT_DETAIL" | TITLE="Live site smoke check failed" make ci-alert-issue state=open run_url="$RUN_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close live-site smoke issue when clean
        if: steps.smoke.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="Live site smoke check failed" make ci-alert-issue state=close run_url="$RUN_URL"

      - name: Summarize live-site smoke failure
        if: steps.smoke.outputs.status != '0'
        run: |
          {
            echo "## Live site smoke failed"
            echo
            echo "Published URL: ${{ steps.site-url.outputs.url }}"
            echo "Issue: ${{ steps.live-issue.outputs.url || 'issue not created' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow on smoke regression
        if: steps.smoke.outputs.status != '0'
        run: exit 1

  # Alerts when smoke fails before it sets a status. Runs on the host runner,
  # which has make and gh.
  setup-failure-alert:
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'failure' && needs.smoke.outputs.status == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Alert when live-site smoke setup fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="Live site smoke check failed" make ci-alert-issue state=setup-failure run_url="$RUN_URL"
