name: Schedule Watchdog

# GitHub auto-disables cron triggers after about 60 days of repository
# inactivity, and a disabled schedule cannot open its own alert issue. This
# watchdog runs from the push trigger (which GitHub never auto-disables) so a
# disabled scheduled workflow becomes a visible alert issue instead of
# silently taking the monitoring layer offline.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONPATH: "."
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Keep the issue identity so healthy runs can close existing watchdog alerts.
  ALERT_TITLE: Scheduled workflow watchdog found stale or disabled schedules

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          event-name: ${{ github.event_name }}
          install-deps: "true"
          browser-engines: ""

      - name: Check scheduled workflow enabled states
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Make maps every failing recipe to exit code 2, so the Python
          # watchdog writes `checked=true|false` for the alert decision.
          set +e
          make ci-schedule-watchdog > schedule-watchdog.txt 2>&1
          status=$?
          set -e
          cat schedule-watchdog.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update disabled schedule issue
        if: steps.watchdog.outputs.checked == 'true' && steps.watchdog.outputs.status != '0'
        id: watchdog-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(TITLE="$ALERT_TITLE" make ci-alert-issue state=open run_url="$RUN_URL" < schedule-watchdog.txt)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close watchdog issue when all schedules are active
        if: steps.watchdog.outputs.checked == 'true' && steps.watchdog.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="$ALERT_TITLE" make ci-alert-issue state=close run_url="$RUN_URL"

      - name: Alert when watchdog setup fails
        if: ${{ !cancelled() && steps.watchdog.outputs.checked != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="$ALERT_TITLE" make ci-alert-issue state=setup-failure run_url="$RUN_URL"

      - name: Fail workflow when the watchdog reports a problem
        if: steps.watchdog.outputs.status != '0'
        run: exit 1
