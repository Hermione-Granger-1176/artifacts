name: Deploy Failure Alert

# The scheduled monitors alert on their own failures. This workflow covers the
# main deploy pipeline: when a run of "Update Artifacts & Deploy" finishes, it
# opens, updates, or closes one alert issue so a broken main deploy is visible.
on:
  workflow_run:
    workflows:
      - Update Artifacts & Deploy
    types:
      - completed

env:
  PYTHONPATH: "."
  ALERT_TITLE: Main deploy pipeline failed
  RUN_URL: ${{ github.event.workflow_run.html_url }}

jobs:
  alert:
    # Only main-branch runs of this repository affect the deploy. A fork pull
    # request from the contributor's own `main` branch also reports
    # head_branch == 'main', so the filter also checks the event and the head
    # repository.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Open or update deploy failure issue
        if: github.event.workflow_run.conclusion == 'failure'
        id: alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_DETAIL: "Failed run commit: ${{ github.event.workflow_run.head_sha }}"
        run: |
          url=$(printf '%s\n' "$ALERT_DETAIL" | TITLE="$ALERT_TITLE" make ci-alert-issue state=open run_url="$RUN_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close deploy failure issue when a main run succeeds
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: TITLE="$ALERT_TITLE" make ci-alert-issue state=close run_url="$RUN_URL"

      # Preview publishes share the Pages concurrency group with the main
      # publish, and GitHub cancels a pending job when a newer job joins the
      # group. A main run cancelled that way neither deploys nor fails, so this
      # step redeploys main when the cancelled run is still the tip of main. It
      # skips a run that a newer main push replaced, because that push deploys.
      - name: Redeploy main when its run was cancelled
        if: github.event.workflow_run.conclusion == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$main_sha" != "$RUN_SHA" ]; then
            echo "Cancelled run $RUN_SHA was superseded by main $main_sha; nothing to redeploy."
            exit 0
          fi
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched a main redeploy for $RUN_SHA after its run was cancelled."

      - name: Summarize deploy failure alert
        if: github.event.workflow_run.conclusion == 'failure'
        run: |
          {
            echo "## Main deploy pipeline failed"
            echo
            echo "Failed run: ${{ github.event.workflow_run.html_url }}"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "Issue: ${{ steps.alert.outputs.url || 'issue not created' }}"
          } >> "$GITHUB_STEP_SUMMARY"
