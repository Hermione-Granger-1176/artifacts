name: CI setup
description: Mint app tokens and optionally install the full toolchain. Requires actions/checkout to have run first.

inputs:
  event-name:
    description: GitHub event name for token policy.
    required: true
  head-repo-fork:
    description: Whether the PR head repo is a fork.
    required: false
    default: "false"
  pr-author:
    description: PR author login for token policy.
    required: false
    default: ""
  app-id:
    description: >-
      Primary GitHub App ID (Hermione1176). Primary and escalation inputs are all-or-nothing in trusted
      contexts; omit all four to skip primary-token minting (audit-only callers).
    required: false
    default: ""
  app-private-key:
    description: >-
      Primary GitHub App private key. All four primary/escalation inputs must be provided together in
      trusted contexts.
    required: false
    default: ""
  escalation-app-id:
    description: >-
      Escalation GitHub App ID (Harry1176). All four primary/escalation inputs must be provided together
      in trusted contexts.
    required: false
    default: ""
  escalation-app-private-key:
    description: >-
      Escalation GitHub App private key. All four primary/escalation inputs must be provided together in
      trusted contexts.
    required: false
    default: ""
  audit-app-id:
    description: Audit-only GitHub App ID (Percy1176). Only the audit workflow passes this; omit elsewhere.
    required: false
    default: ""
  audit-app-private-key:
    description: Audit-only GitHub App private key (Percy1176). Only the audit workflow passes this; omit elsewhere.
    required: false
    default: ""
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  node-version:
    description: Node.js version to install (empty to skip).
    required: false
    default: ""
  install-deps:
    description: Whether to install workspace dependencies.
    required: false
    default: "false"
  browser-engines:
    description: >-
      Hyphen-separated Playwright engines to install, empty for none. This is the only browser knob:
      the engine set says both whether to install and what to install, so there is no way to express
      the contradiction a separate boolean allowed. The installed Playwright package version and engine
      set form the browser cache key, so a dependency or engine change downloads the required browsers
      while unrelated lockfile changes keep reusing compatible binaries.
    required: false
    default: chromium

outputs:
  app-token:
    description: Primary GitHub App installation token.
    value: ${{ steps.app-token.outputs.token }}
  escalation-token:
    description: Escalation GitHub App installation token.
    value: ${{ steps.escalation-token.outputs.token }}
  audit-token:
    description: >-
      Audit-only GitHub App installation token. Empty unless audit-app credentials were supplied AND the
      token was minted; also empty when the token policy denies minting (e.g., untrusted forks) or the
      audit-token step was otherwise skipped.
    value: ${{ steps.audit-token.outputs.token }}
  token-available:
    description: >-
      Whether both primary tokens (Hermione + Harry) were minted successfully. False when primary
      credentials were intentionally omitted (audit-only callers). Audit-token availability is orthogonal.
    value: ${{ steps.token-status.outputs.available }}

runs:
  using: composite
  steps:
    - name: Determine whether app-token actions are allowed
      id: token-policy
      shell: bash
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_REPO_FORK: ${{ inputs.head-repo-fork }}
        PR_AUTHOR: ${{ inputs.pr-author }}
      run: >-
        PYTHONPATH=. python3 scripts/ci/workflow_helpers.py app-token-policy
        --event-name "$EVENT_NAME"
        --head-repo-fork "$HEAD_REPO_FORK"
        --pr-author "$PR_AUTHOR"
        >> "$GITHUB_OUTPUT"

    - name: Validate primary token configuration
      if: >-
        steps.token-policy.outputs.allowed == 'true'
        && (inputs.app-id != '' || inputs.app-private-key != ''
        || inputs.escalation-app-id != '' || inputs.escalation-app-private-key != '')
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        ESCALATION_APP_ID: ${{ inputs.escalation-app-id }}
        ESCALATION_APP_PRIVATE_KEY: ${{ inputs.escalation-app-private-key }}
      run: |
        missing=()
        [ -z "$APP_ID" ] && missing+=("app-id")
        [ -z "$APP_PRIVATE_KEY" ] && missing+=("app-private-key")
        [ -z "$ESCALATION_APP_ID" ] && missing+=("escalation-app-id")
        [ -z "$ESCALATION_APP_PRIVATE_KEY" ] && missing+=("escalation-app-private-key")
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Primary app inputs (app-id, app-private-key, escalation-app-id, escalation-app-private-key) must be provided together; missing: ${missing[*]}." >&2
          exit 1
        fi

    - name: Create GitHub App token
      id: app-token
      if: steps.token-policy.outputs.allowed == 'true' && inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Create escalation token
      id: escalation-token
      if: steps.token-policy.outputs.allowed == 'true' && inputs.escalation-app-id != '' && inputs.escalation-app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.escalation-app-id }}
        private-key: ${{ inputs.escalation-app-private-key }}

    - name: Create audit token
      id: audit-token
      if: steps.token-policy.outputs.allowed == 'true' && inputs.audit-app-id != '' && inputs.audit-app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.audit-app-id }}
        private-key: ${{ inputs.audit-app-private-key }}

    - name: Validate audit token configuration
      if: >-
        steps.token-policy.outputs.allowed == 'true'
        && (inputs.audit-app-id != '' || inputs.audit-app-private-key != '')
      shell: bash
      env:
        TOKEN_POLICY_ALLOWED: ${{ steps.token-policy.outputs.allowed }}
        AUDIT_APP_ID: ${{ inputs.audit-app-id }}
        AUDIT_APP_PRIVATE_KEY: ${{ inputs.audit-app-private-key }}
        AUDIT_TOKEN: ${{ steps.audit-token.outputs.token }}
      run: |
        if [ -z "$AUDIT_APP_ID" ] || [ -z "$AUDIT_APP_PRIVATE_KEY" ]; then
          echo "::error::Both audit-app-id and audit-app-private-key must be provided together; got only one." >&2
          exit 1
        fi
        if [ "$TOKEN_POLICY_ALLOWED" = "true" ] && [ -z "$AUDIT_TOKEN" ]; then
          echo "::error::Audit credentials were provided, but steps.audit-token.outputs.token is empty. Token minting failed or the app is not installed on this repository." >&2
          exit 1
        fi

    - name: Check GitHub App token availability
      id: token-status
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        ESCALATION_TOKEN: ${{ steps.escalation-token.outputs.token }}
      run: |
        if [ -n "$APP_TOKEN" ] && [ -n "$ESCALATION_TOKEN" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Fail if a trusted run cannot mint the app tokens
      if: >-
        steps.token-policy.outputs.allowed == 'true'
        && inputs.app-id != ''
        && steps.token-status.outputs.available != 'true'
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        ESCALATION_TOKEN: ${{ steps.escalation-token.outputs.token }}
      run: |
        echo "Expected GitHub App tokens for this run, but token creation did not succeed." >&2
        [ -z "$APP_TOKEN" ] && echo "  - Hermione1176 (APP_ID) token missing" >&2
        [ -z "$ESCALATION_TOKEN" ] && echo "  - Harry1176 (ESCALATION_APP_ID) token missing" >&2
        exit 1

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # setup-uv reads tool.uv.required-version from pyproject.toml, which keeps
    # local and CI invocations on one minimum-compatible policy. Its dependency cache is
    # disabled because the conditional uv cache below is restored only when a
    # .venv miss means uv will actually consume it.
    - name: Set up uv
      if: inputs.install-deps == 'true'
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: false

    # Likewise no `cache: npm`: ~/.npm only matters when `npm ci` runs, and a
    # node_modules hit means it does not. The conditional cache below restores
    # it exactly when it will be read.
    - name: Set up Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve Node.js version
      id: node-version
      if: inputs.install-deps == 'true' && inputs.node-version != ''
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Cache virtual environment
      id: venv-cache
      if: inputs.install-deps == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

    - name: Cache node modules
      id: node-modules-cache
      if: inputs.install-deps == 'true' && inputs.node-version != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json') }}

    # The download caches below are gated on their consumer having missed. A
    # .venv hit means `make install` never runs, so ~/.cache/uv is restored and
    # then read by nothing; the same holds for ~/.npm against `npm ci`. Gating
    # keeps them for the miss path, where they are what makes the rebuild fast,
    # and skips the transfer on the hit path, which is the common case.
    - name: Cache uv downloads
      if: inputs.install-deps == 'true' && steps.venv-cache.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-
          uv-${{ runner.os }}-${{ runner.arch }}-

    # Also gated on node-version, which the action allows to be empty: without
    # it an empty caller would cache ~/.npm under a key with a hollow version
    # segment for a toolchain that was never set up.
    - name: Cache npm downloads
      if: >-
        inputs.install-deps == 'true' && inputs.node-version != ''
        && steps.node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-
          npm-${{ runner.os }}-${{ runner.arch }}-

    - name: Install workspace dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        VENV_CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
        NODE_MODULES_CACHE_HIT: ${{ steps.node-modules-cache.outputs.cache-hit }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        if [ "$VENV_CACHE_HIT" != "true" ]; then
          make install
          make ci-prune-uv-cache
        fi
        if [ -n "$NODE_VERSION" ] && [ "$NODE_MODULES_CACHE_HIT" != "true" ]; then
          make node-install
        fi

    - name: Resolve Playwright version
      id: playwright-version
      if: inputs.install-deps == 'true' && inputs.browser-engines != ''
      shell: bash
      run: echo "version=$(make --no-print-directory playwright-version)" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      if: inputs.install-deps == 'true' && inputs.browser-engines != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser-engines }}

    - name: Install Playwright browsers
      if: inputs.install-deps == 'true' && inputs.browser-engines != ''
      shell: bash
      env:
        BROWSER_ENGINES: ${{ inputs.browser-engines }}
        PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        # A cache hit restores browser binaries, never the system libraries
        # they load. Those are apt packages on an ephemeral runner, so they
        # are gone every time and --with-deps has to reinstall them for any
        # engine the runner image does not already satisfy. Chromium's are on
        # the standard image, which is why a Chromium-only hit may skip the
        # pass; WebKit's are not, and skipping it left MiniBrowser unable to
        # load its libraries even though the binary restored fine.
        if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ] && [ "$BROWSER_ENGINES" = "chromium" ]; then
          make setup-playwright-engines engines="$BROWSER_ENGINES"
        else
          make setup-playwright-engines engines="$BROWSER_ENGINES" with_deps=1
        fi
