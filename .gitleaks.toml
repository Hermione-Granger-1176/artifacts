# Secret-scanning scope for the secret-scan job in .github/workflows/update.yml.
#
# The job checks out with fetch-depth: 0, which fetches every branch. On events
# that have no commit range (workflow_dispatch, schedule), gitleaks walks all of
# that history, including gh-pages: the published site plus one built copy per
# pull request under pr-preview/.
#
# The pr-preview/ copies are excluded. They exist on no source branch, and CI
# assembles them from the repository tree, which this scan covers in full. Every
# rule stays active everywhere else, including all of the default branch's history.

[extend]
useDefault = true

[allowlist]
description = "CI-generated PR preview copies published to gh-pages"
paths = ['''^pr-preview/''']
